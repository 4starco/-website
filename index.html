<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>4★ &amp; Co</title>
<meta name="description" content="4★ &amp; Co is the company of Jai Forster.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap">
<style>
/* Layout: one screen, left aligned. The F mark sits small at the top as the signature and again oversized and faint off the bottom right as the watermark. One hairline of gold, nothing else. */
:root{
  --ground:#2C302E;
  --ground-deep:#252927;
  --ink:#F3F2EE;
  --ink-soft:#A9ADA9;
  --line:#3E4340;
  --gold:#B89A5E;
  --face:"Inter Tight","Helvetica Neue",Arial,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);font-family:var(--face);
  font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-left:max(24px,env(safe-area-inset-left,0px));
  padding-right:max(24px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  overflow-x:hidden;position:relative;
}
.watermark{
  position:fixed;right:-14vmin;bottom:-18vmin;width:78vmin;max-width:none;
  opacity:.045;pointer-events:none;user-select:none;z-index:0;
}
.page{
  position:relative;z-index:1;max-width:1080px;margin:0 auto;min-height:100%;
  display:flex;flex-direction:column;gap:clamp(56px,10vh,120px);
  padding-block:clamp(32px,7vh,72px) 32px;
}
header{display:flex;align-items:center;gap:14px}
header img{width:44px;height:auto;display:block}
header span{font-weight:500;font-size:.95rem;letter-spacing:.04em}
main{display:flex;flex-direction:column;gap:28px;max-width:36rem}
h1{
  margin:0;font-weight:300;font-size:clamp(2.4rem,6.4vw,4.4rem);
  line-height:1.04;letter-spacing:-.025em;text-wrap:balance;
}
.rule{width:56px;height:1px;background:var(--gold);border:0;margin:4px 0 0}
p{margin:0;color:var(--ink-soft);font-size:1.12rem;max-width:32rem}
.links{display:flex;flex-direction:column;gap:0;margin-top:20px;border-top:1px solid var(--line)}
.links a{
  display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:16px;
  padding:18px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;
}
.links .k{font-weight:500;font-size:1.15rem}
.links .v{color:var(--ink-soft);font-size:.95rem;display:flex;gap:10px;align-items:baseline}
.links .arrow{display:inline-block;transition:transform .2s ease;color:var(--gold)}
.links a:hover .arrow,.links a:focus-visible .arrow{transform:translateX(4px)}
.links a:hover .k{color:#fff}
a:focus-visible{outline:1px solid var(--gold);outline-offset:4px}
footer{
  margin-top:auto;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;
  color:var(--ink-soft);font-size:.82rem;letter-spacing:.02em;
}
@media (max-width:520px){
  body{font-size:16px}
}
@media (prefers-reduced-motion:reduce){.links .arrow{transition:none}}
</style>
</head>
<body>
<img class="watermark" src="assets/mark-white.png" alt="" aria-hidden="true">
<div class="page">
  <header>
    <img src="assets/mark-white.png" alt="4Star mark">
    <span>4★ &amp; Co</span>
  </header>
  <main>
    <h1>The company of Jai&nbsp;Forster.</h1>
    <hr class="rule">
    <p>4★ &amp; Co employs the team and holds the work behind Jai Forster in health, fitness, business and media.</p>
    <nav class="links" aria-label="Links">
      <a href="https://jaiforster.com" rel="noopener"><span class="k">Jai Forster</span><span class="v"><span class="host">jaiforster.com</span><span class="arrow">→</span></span></a>
      <a href="mailto:mail@4star.co"><span class="k">Contact</span><span class="v"><span class="host">mail@4star.co</span><span class="arrow">→</span></span></a>
    </nav>
  </main>
  <footer>
    <span>© 2026 4★ &amp; Co</span>
    <span>Australia</span>
  </footer>
</div>
</body>
</html>
