<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>4★ &amp; Co</title>
<meta name="description" content="4★ &amp; Co is the company of Jai Forster.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap">
<style>
/* Layout: one screen, left aligned. The F mark sits small at the top as the signature and again oversized and faint off the bottom right as the watermark. One hairline of gold, nothing else. */
:root{
  --ground:#2C302E;
  --ground-deep:#252927;
  --ink:#F3F2EE;
  --ink-soft:#A9ADA9;
  --line:#3E4340;
  --gold:#B89A5E;
  --face:"Inter Tight","Helvetica Neue",Arial,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);font-family:var(--face);
  font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-left:max(24px,env(safe-area-inset-left,0px));
  padding-right:max(24px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  overflow-x:hidden;position:relative;
}
.watermark{
  position:fixed;right:-14vmin;bottom:-18vmin;width:78vmin;max-width:none;
  opacity:.045;pointer-events:none;user-select:none;z-index:0;
}
.page{
  position:relative;z-index:1;max-width:1080px;margin:0 auto;min-height:100%;
  display:flex;flex-direction:column;gap:clamp(56px,10vh,120px);
  padding-block:clamp(32px,7vh,72px) 32px;
}
header{display:flex;align-items:center;gap:14px}
header img{width:44px;height:auto;display:block}
header span{font-weight:500;font-size:.95rem;letter-spacing:.04em}
main{display:flex;flex-direction:column;gap:28px;max-width:36rem}
h1{
  margin:0;font-weight:300;font-size:clamp(2.4rem,6.4vw,4.4rem);
  line-height:1.04;letter-spacing:-.025em;text-wrap:balance;
}
.rule{width:56px;height:1px;background:var(--gold);border:0;margin:4px 0 0}
p{margin:0;color:var(--ink-soft);font-size:1.12rem;max-width:32rem}
.links{display:flex;flex-direction:column;gap:0;margin-top:20px;border-top:1px solid var(--line)}
.links a{
  display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:16px;
  padding:18px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;
}
.links .k{font-weight:500;font-size:1.15rem}
.links .v{color:var(--ink-soft);font-size:.95rem;display:flex;gap:10px;align-items:baseline}
.links .arrow{display:inline-block;transition:transform .2s ease;color:var(--gold)}
.links a:hover .arrow,.links a:focus-visible .arrow{transform:translateX(4px)}
.links a:hover .k{color:#fff}
.links .row{
  display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:16px;width:100%;
  padding:18px 0;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);
  font:inherit;text-align:left;cursor:pointer;
}
.links .row:hover .arrow,.links .row:focus-visible .arrow{transform:translateX(4px)}
.links .row[aria-expanded="true"] .arrow{transform:rotate(90deg)}
.links .row:hover .k{color:#fff}
.links .row:focus-visible{outline:1px solid var(--gold);outline-offset:4px}
.enquire{display:grid;gap:14px;padding:22px 0 26px;border-bottom:1px solid var(--line)}
.enquire[hidden]{display:none}
.enquire label{display:grid;gap:6px;color:var(--ink-soft);font-size:.85rem;letter-spacing:.02em}
.enquire input,.enquire textarea{
  width:100%;background:var(--ground-deep);color:var(--ink);border:1px solid var(--line);border-radius:2px;
  padding:12px 14px;font:inherit;font-size:1rem;
}
.enquire textarea{min-height:120px;resize:vertical}
.enquire input:focus,.enquire textarea:focus{outline:none;border-color:var(--gold)}
.enquire .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.enquire button{
  justify-self:start;background:none;color:var(--ink);border:1px solid var(--gold);border-radius:2px;
  padding:11px 22px;font:inherit;font-weight:500;font-size:.95rem;cursor:pointer;
}
.enquire button:hover{background:var(--gold);color:var(--ground)}
.enquire button:disabled{opacity:.5;cursor:default}
.enquire .note{margin:0;font-size:.9rem;color:var(--ink-soft);min-height:1.2em}
a:focus-visible{outline:1px solid var(--gold);outline-offset:4px}
footer{
  margin-top:auto;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;
  color:var(--ink-soft);font-size:.82rem;letter-spacing:.02em;
}
@media (max-width:520px){
  body{font-size:16px}
}
@media (prefers-reduced-motion:reduce){.links .arrow{transition:none}}
</style>
</head>
<body>
<img class="watermark" src="assets/mark-white.png" alt="" aria-hidden="true">
<div class="page">
  <header>
    <img src="assets/mark-white.png" alt="4Star mark">
    <span>4★ &amp; Co</span>
  </header>
  <main>
    <h1>The company of Jai&nbsp;Forster.</h1>
    <hr class="rule">
    <p>Jai Forster builds businesses and teams and 4★ &amp; Co holds the intellectual property behind it all.</p>
    <nav class="links" aria-label="Links">
      <a href="https://jaiforster.com" rel="noopener"><span class="k">Jai Forster</span><span class="v"><span class="host">jaiforster.com</span><span class="arrow">→</span></span></a>
      <button class="row" type="button" aria-expanded="false" aria-controls="enquire"><span class="k">Contact</span><span class="v"><span class="host">Get in touch</span><span class="arrow">→</span></span></button>
      <form class="enquire" id="enquire" action="https://formspree.io/f/xeepekqr" method="POST" hidden>
        <label>Name<input name="name" type="text" autocomplete="name" required></label>
        <label>Email<input name="email" type="email" autocomplete="email" required></label>
        <label>Message<textarea name="message" required></textarea></label>
        <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
        <input type="hidden" name="_subject" value="4star.co enquiry">
        <button type="submit">Send</button>
        <p class="note" role="status" aria-live="polite"></p>
      </form>
    </nav>
  </main>
  <footer>
    <span>© 2026 4★ &amp; Co</span>
    <span>Australia</span>
  </footer>
</div>
<script>
(function(){
  var btn=document.querySelector('.row'),form=document.getElementById('enquire'),note=form.querySelector('.note'),send=form.querySelector('button');
  btn.addEventListener('click',function(){
    var open=btn.getAttribute('aria-expanded')==='true';
    btn.setAttribute('aria-expanded',String(!open));form.hidden=open;
    if(!open)form.querySelector('input').focus();
  });
  form.addEventListener('submit',function(e){
    e.preventDefault();send.disabled=true;note.textContent='Sending...';
    fetch(form.action,{method:'POST',body:new FormData(form),headers:{Accept:'application/json'}})
      .then(function(r){
        if(!r.ok)throw 0;
        form.querySelectorAll('label,button').forEach(function(el){el.hidden=true});
        note.textContent='Thanks. We will be in touch.';
      })
      .catch(function(){send.disabled=false;note.textContent='That did not send. Please try again.'});
  });
})();
</script>
</body>
</html>
