<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@1,6..72,300;1,6..72,400&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="brand" href="index.html"><img src="mark.png" alt="">Jai Forster</a>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="menu">Menu</button>
    <nav class="menu" id="menu" aria-label="Main"><a href="about.html">About</a><a href="mind.html">Mind</a><a href="movement.html">Movement</a><a href="design.html">Design</a><a href="bio.html">Bio</a><a href="blog.html">Blog</a><a href="connect.html" aria-current="page">Connect</a></nav>
  </div>
</header>
<main>
<section class="banner">
  <img src="https://images.squarespace-cdn.com/content/v1/53a4e9e1e4b0f3bbc3a83e2f/1645785949477-ILQMY7SG9RDQ2MYZ922V/Website+Parallax+Contact.png?format=2500w" alt="" style="object-position:center 30%">
  <div class="wrap">
    <h1>Connect</h1>
  </div>
</section>
<div class="wrap"><section class="connect">
  <div>
    <a class="route" href="https://lifelogic.co"><b>Connect with Life Logic</b><span>lifelogic.co</span></a>
    <a class="route" href="https://unlimitedfitness.com.au"><b>Connect with Unlimited Fitness</b><span>unlimitedfitness.com.au</span></a>
    <a class="route" href="https://instagram.com/lifelogic.co"><b>Instagram</b><span>@lifelogic.co and @unlimitedfitness.com.au</span></a>
  </div>
  <form>
    <div class="two"><label>First name<input name="first" autocomplete="given-name" required></label><label>Last name<input name="last" autocomplete="family-name" required></label></div>
    <label>Email address<input name="email" type="email" autocomplete="email" required></label>
    <label>Subject<input name="subject" required></label>
    <label>Message<textarea name="message" required></textarea></label>
    <button type="submit">Send Jai an email</button>
    <p class="note" role="status" aria-live="polite"></p>
  </form>
</section></div>
</main>
<footer>
  <div class="wrap">
    <span class="mark"><img src="mark.png" alt="">© 2026 Jai Forster</span>
    <nav aria-label="Footer"><a href="index.html">Home</a><a href="about.html">About</a><a href="mind.html">Mind</a><a href="movement.html">Movement</a><a href="design.html">Design</a><a href="bio.html">Bio</a><a href="blog.html">Blog</a><a href="connect.html">Connect</a></nav>
  </div>
</footer>
<script>
(function(){var b=document.querySelector('.menu-btn'),m=document.getElementById('menu');
b.addEventListener('click',function(){var o=m.classList.toggle('open');b.setAttribute('aria-expanded',String(o));});
var f=document.querySelector('form');if(f){f.addEventListener('submit',function(e){e.preventDefault();f.querySelector('.note').textContent='This is the example site, so the form is not connected yet.';});}})();
</script>
